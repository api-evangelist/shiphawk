apis:
- name: ShipHawk API v4
  description: >-
    ShipHawk's public REST API. Key-based authentication (X-Api-Key header or api_key
    query parameter), JSON request and response bodies, POST used for both create and
    update (no PUT/PATCH). Resources cover addresses and address validation, batches,
    child accounts and child-account users, documents, handling units, job trackers,
    material containers, orders and order line items, proposed shipments, rates,
    shipments and shipment notes, SKUs and bulk SKU import, unpacked items, users,
    warehouses, webhooks and workstations.
  humanURL: https://docs.shiphawk.com/
  baseURL: https://shiphawk.com/api/v4

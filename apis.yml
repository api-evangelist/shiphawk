aid: shiphawk
name: ShipHawk
description: >-
  ShipHawk is a Santa Barbara, California shipping and warehouse automation platform
  for high-volume eCommerce, wholesale and manufacturing shippers. It combines a
  multi-carrier transportation management system (TMS), a warehouse management system
  (WMS), packing and rate optimization, and shipping business rules, and it plugs into
  ERPs including NetSuite, Acumatica, Infor, Microsoft Dynamics 365, Sage and SAP.
  ShipHawk publishes a public REST API (v4) covering rating, address validation, orders,
  proposed shipments, shipments, SKUs, handling units, material containers, warehouses,
  workstations, documents (labels, BOLs, commercial invoices, packing slips), tracking
  and webhooks, documented in a single Slate reference at docs.shiphawk.com and served
  from shiphawk.com/api/v4 with a shared sandbox at sandbox.shiphawk.com.

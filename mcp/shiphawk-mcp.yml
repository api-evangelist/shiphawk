description: >-
  ShipHawk ships no MCP server. This file records that absence and derives a CANDIDATE tool
  surface from ShipHawk's own documented v4 endpoints, so the shape of an eventual server is
  on record. Nothing here is live and no MCPServer pointer is wired into apis.yml.
status: candidate
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: api-key
  verified: searched
  note: >-
    `auth: api-key` describes what any future server would have to carry — ShipHawk's only
    credential is a single environment-scoped API key with full account authority, which is a
    poor fit for delegated agent access: there is no OAuth, no scopes and no way to issue a
    read-only or shipment-only credential.

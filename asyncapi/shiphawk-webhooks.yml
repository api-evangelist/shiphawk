docs: https://docs.shiphawk.com/#webhooks
description: >-
  ShipHawk's event surface is HTTP webhooks, managed through the API itself. There is no
  AsyncAPI document, no streaming/SSE surface and no message broker — so no asyncapi/ spec
  is emitted, only this webhook catalog. The event list below is the one ShipHawk returns
  from its own discovery endpoint, GET /api/v4/webhooks/events.
asyncapi_spec: none published
transport: HTTP POST callback
subscription_model: >-
  Self-service through the API. A subscription is a Webhook object with a callback_url and an
  events[] array; a single subscription can carry many event types, and an account can hold
  many subscriptions.
discovery_endpoint:
  method: GET
  path: /api/v4/webhooks/events
  description: Returns the list of event types available to the account.
management_endpoints:
- method: GET
  path: /api/v4/webhooks/events
  summary: Get list of available webhook events
- method: POST
  path: /api/v4/webhooks
  summary: Create a webhook subscription
- method: GET
  path: /api/v4/webhooks
  summary: List created webhook subscriptions
- method: GET
  path: /api/v4/webhooks/:id
  summary: Retrieve a webhook subscription
- method: POST
  path: /api/v4/webhooks/:id
  summary: Update a webhook subscription
- method: DELETE
  path: /api/v4/webhooks/:id
  summary: Delete a webhook subscription
subscription_object:
  fields:
  - name: id
    type: string
    example_prefix: wh_
  - name: callback_url
    type: string
    required: true
    description: Publicly accessible URL.
  - name: events
    type: array of enum
  - name: use_basic_auth
    type: boolean
  - name: basic_auth_username
    type: string
  - name: basic_auth_password
    type: string
  - name: created_at
    type: string (ISO 8601)

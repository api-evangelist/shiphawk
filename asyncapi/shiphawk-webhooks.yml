security:
  signature_verification: false
  signature_header: none published
  mechanism: >-
    Optional HTTP Basic authentication on the callback — the subscriber supplies
    use_basic_auth, basic_auth_username and basic_auth_password, and ShipHawk presents them
    to the callback URL. There is no HMAC signature, no timestamp header and no replay
    protection, so a receiver cannot cryptographically verify that a payload came from
    ShipHawk. Basic auth over TLS is the only authenticity control offered.
  ip_allowlist: not published
delivery:
  retry_policy: not documented
  ordering_guarantee: not documented
  at_least_once: not documented
  timeout: not documented
  dead_letter: not documented
  note: >-
    ShipHawk publishes no delivery semantics for webhooks at all. Receivers should assume
    duplicates and out-of-order arrival are possible and reconcile against the REST resource
    (GET /api/v4/shipments/:id) rather than trusting the event body as the system of record.
gaps:
- No AsyncAPI document.
- No signed payloads (HMAC) — only optional Basic auth.
- No published retry/backoff, ordering or delivery guarantees.
- Example payloads published for only 5 of the 10 event names that appear in the reference.
- The events[] enum and the discovery-endpoint example response list different sets of events.
